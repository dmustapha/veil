[package]
name = "veil-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Standalone crate (not part of any parent workspace), mirroring veil-pool / veil-verifier.
[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "26", features = ["hazmat"] }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["hazmat", "testutils"] }
