[package]
name = "veil-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Standalone crate (not part of any parent workspace), mirroring veil-pool / veil-verifier.
[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "=27.0.0-rc.1", features = ["hazmat"] }
# Reuse the proven Poseidon2 primitive + note hashes so the vault's gating trees and the circuits
# (unlock/seize membership) share ONE hash — no re-derivation.
veil-pool = { path = "../veil-pool" }
# Groth16Proof / Groth16Error types for the cross-contract call to the deployed borrow verifier.
veil-verifier = { path = "../veil-verifier" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.0-rc.1", features = ["hazmat", "testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
