[package]
name = "pgate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Standalone crate (not part of any parent workspace).
[workspace]

[lib]
crate-type = ["lib"]
doctest = false

[dependencies]
soroban-sdk = { version = "26", features = ["hazmat"] }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["hazmat", "testutils"] }
